<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
  <title>Ôn tập · CIE Science 5</title>
  <!-- CSS dựng sẵn lúc build (tên file có hash). Thiếu Node thì builder tự
       thay dòng này bằng Tailwind CDN. -->
  <link rel="stylesheet" href="../assets/tw.ca25555e.css">
  <script defer src="../assets/alpine.63d2636a.js"></script>
  <script>
    // ── Vỏ tĩnh, nội dung nạp bằng fetch ────────────────────────────────────
    // Trang này KHÔNG nhúng câu hỏi vào HTML: Tailwind quét dist/**/*.html lúc
    // build nên nhúng vào chỉ làm trang phình, còn class thì vẫn phải nằm sẵn
    // trong template dù nội dung đến từ đâu. Vì vậy MỌI class Tailwind ở dưới
    // đều là chuỗi literal — tuyệt đối không ghép kiểu 'bg-' + màu + '-100',
    // Tailwind không nhìn thấy và sẽ cắt mất.
    function studyStore(user, course) {
      return {
        user, course,
        data: null, err: '', ready: false, online: false,
        secret: localStorage.getItem('lms_key') || '',
        cards: {},              // item_id → {n, wrong, box, ease, due, last_ts}
        // Vào trang là thấy TÓM TẮT: đọc trước, làm bài sau. Hai chế độ kia phải
        // bấm mới vào, nên screen khởi tạo theo 'summary' cho khớp go('summary').
        screen: 'summary',      // start | quiz | done | summary
        mode: 'summary',        // quiz | cards | summary | map
        revealed: false,        // flashcard: đã lật chưa
        learnAt: 0,             // chế độ Học: đang xem thẻ thứ mấy
        seen: {},               // chế độ Kiểm tra: id → 'known' | 'again' (trong phiên)
        tStats: { n: 0, known: 0 },
        qStats: { n: 0, ok: 0 },
        lastId: null,
        openMap: {},            // cây bên trái: nhánh nào đang mở
        // Bộ lọc các phần trong tóm tắt. Mỗi loại một màu cố định (xem KINDS) để
        // nhìn là biết đang đọc loại gì, và bật/tắt được từng loại.
        // Chip lọc = LỰA CHỌN của người dùng, không phải trạng thái hiển thị.
        // Không chọn chip nào (mặc định) nghĩa là xem tất cả — xem getter `show`.
        filt: JSON.parse(localStorage.getItem('lms_pick') || 'null') || { gloss: false, facts: false, list: false, watch: false, exp: false, compare: false },
        detail: localStorage.getItem('lms_detail') === '1',
        scope: null,            // chủ đề đang học; null = cả môn
        navOpen: false,         // ngăn kéo cây trên màn hình hẹp
        queue: [], at: 0, picked: null, answered: false, wrongAgain: 0,
        log: [], shownAt: 0,

        async init() {
          try {
            const r = await fetch('study/cie-science-5.json', { headers: { accept: 'application/json' } });
            if (!r.ok) throw new Error('HTTP ' + r.status);
            this.data = await r.json();
          } catch (e) {
            this.err = 'Không tải được học liệu ôn tập.';
            this.ready = true;
            return;
          }
          // Lịch ôn: không có cũng học được, chỉ là không ghi lại (mở file cục
          // bộ, hoặc bản trên GitHub Pages). Không báo lỗi.
          try {
            const r = await fetch(`/api/study?user=${this.user}&course=${this.course}`,
                                  { headers: { accept: 'application/json' } });
            if (r.ok) {
              const d = await r.json();
              const ix = Object.fromEntries(d.cols.map((c, i) => [c, i]));
              for (const row of d.rows) {
                this.cards[row[ix.item_id]] = Object.fromEntries(d.cols.map((c, i) => [c, row[i]]));
              }
              this.online = true;
            }
          } catch (e) { /* chế độ chỉ đọc */ }
          this.flushBuffer();
          this.ready = true;
        },

        // ── Lịch ôn giãn cách (Leitner + SM-2 rút gọn) ────────────────────────
        // Tính bằng SỐ NGUYÊN từ đầu tới cuối: ease lưu ×100 để client và mọi
        // phép dựng lại phía máy chủ ra cùng kết quả từng bit. Máy chủ kẹp lại
        // mọi giá trị lần nữa, không tin client.
        sched(id, c, g, now) {
          const BOX = [0, 1, 2, 4, 8, 16, 32];   // số ngày theo bậc 1..6
          let box = c ? c.box : 1, ease = c ? c.ease : 250;
          if (g <= 1) {
            box = Math.max(1, box - 1);
            ease = Math.max(130, ease - 20);
            return { box, ease, due: now + 600 };   // gặp lại NGAY trong phiên
          }
          box = Math.min(6, box + 1);
          ease = Math.min(350, Math.max(130, ease + (g === 3 ? 10 : -10)));
          // Nhiễu ±10% suy TẤT ĐỊNH từ id: để các mốc ôn không dồn hết vào một
          // ngày, mà vẫn tính lại được y hệt khi phát lại lịch sử.
          let h = 0;
          for (let i = 0; i < id.length; i++) h = (h * 31 + id.charCodeAt(i)) >>> 0;
          const days = BOX[box] * ease / 250 * (1 + ((h % 21) - 10) / 100);
          return { box, ease, due: now + Math.max(1, Math.round(days)) * 86400 };
        },

        // ── Chọn câu cho phiên ────────────────────────────────────────────────
        get allItems() { return [...(this.data?.quiz || []), ...(this.data?.flashcards || [])]; },
        parentOf(cid) {
          const c = (this.data?.concepts || []).find(x => x.id === cid);
          return c ? c.parent : null;
        },
        // Tỉ lệ sai của một chủ đề, cộng dồn lên cây. Đây là phần thưởng của
        // việc để sơ đồ tư duy dạng cây: yếu ở "properties" nâng điểm của MỌI câu
        // nằm dưới nó, kể cả câu chưa gặp bao giờ — hệ thống khái quát hoá thay
        // vì chỉ nhai lại đúng câu đã sai.
        conceptErr(cid, seen) {
          if (!cid) return 0;
          seen = seen || new Set();
          if (seen.has(cid)) return 0;              // chặn cây bị vòng
          seen.add(cid);
          if (this._cerr && this._cerr[cid] !== undefined) return this._cerr[cid];
          let n = 0, wrong = 0;
          for (const q of this.allItems) {
            if (q.concept !== cid) continue;
            const c = this.cards[q.id];
            if (c) { n += c.n; wrong += c.wrong; }
          }
          const own = (wrong + 0.5) / (n + 1.0);
          const p = this.parentOf(cid);
          const v = p ? 0.65 * own + 0.35 * this.conceptErr(p, seen) : own;
          (this._cerr = this._cerr || {})[cid] = v;
          return v;
        },
        // ── Nghỉ hưu câu đã thuộc ─────────────────────────────────────────────
        // SUY RA từ card chứ không ghi vào file nội dung: thuộc bài là trạng thái
        // của NGƯỜI HỌC, không phải thuộc tính của câu hỏi. Ghi vào nội dung thì
        // một học sinh thuộc sẽ làm câu đó biến mất với học sinh khác.
        //
        // Câu đã thuộc vẫn được ôn, nhưng CHỈ khi thật sự đến hạn (bậc 6 ≈ 32
        // ngày) và không bao giờ chen vào phần ưu tiên. Thiếu bước này thì bộ
        // thẻ phình mãi và mỗi phiên càng lúc càng toàn bài đã thuộc.
        // Ngưỡng "đã nắm chắc". Ba điều kiện đánh vào ba kiểu may rủi khác nhau:
        // số lần chặn đúng-vài-lần-đầu, tỉ lệ sai chặn sai rải rác, bậc ôn chặn
        // đúng dồn trong MỘT buổi (muốn lên bậc phải đúng ở các lần cách nhau
        // nhiều ngày). Hạ ngưỡng thì hạ cả ba, đừng bỏ hẳn điều kiện nào.
        RETIRE: { n: 3, box: 3, err: 0.25 },
        // Bỏ qua mục đã nắm chắc — MẶC ĐỊNH TẮT: người mới vào chưa có mục nào
        // "nắm chắc", bật sẵn thì chẳng lọc gì mà lại giấu mất một lựa chọn.
        skipKnown: localStorage.getItem('lms_skip_known') === '1',
        toggleSkip() { this.skipKnown = !this.skipKnown; localStorage.setItem('lms_skip_known', this.skipKnown ? '1' : '0'); },
        showList: false,
        // Nguồn của MỌI lượt chọn câu: bật lọc thì mục đã nắm chắc đứng ngoài hẳn.
        pool(kind) {
          const all = kind === 'cards' ? this.scopedCards : this.scopedQuiz;
          return this.skipKnown ? all.filter(q => !this.retired(q)) : all;
        },
        get poolItems() { return this.pool(this.mode === 'cards' ? 'cards' : 'quiz'); },
        // Bảng trạng thái: một dòng mỗi mục, sắp mục yếu lên trước.
        get listRows() {
          const now = Math.floor(Date.now() / 1000);
          return this.modeItems.map(q => {
            const c = this.cards[q.id];
            const n = c?.n || 0, wrong = c?.wrong || 0;
            const st = !c || !n ? 'new' : (this.retired(q) ? 'known'
                     : (wrong / n > 0.34 ? 'weak' : 'learning'));
            return {
              id: q.id, text: q.stem_en || q.front_en || '', concept: this.conceptName(q.concept),
              n, wrong, box: c?.box || 0, st,
              due: c?.due ? Math.round((c.due - now) / 86400) : null,
            };
          }).sort((a, b) => ({ weak: 0, learning: 1, new: 2, known: 3 })[a.st]
                          - ({ weak: 0, learning: 1, new: 2, known: 3 })[b.st]
                          || (b.wrong / (b.n || 1)) - (a.wrong / (a.n || 1)));
        },
        ST: { weak:    { t: 'Hay sai',    c: 'bg-rose-100 text-rose-700' },
              learning:{ t: 'Đang học',   c: 'bg-amber-100 text-amber-700' },
              new:     { t: 'Chưa làm',   c: 'bg-slate-100 text-slate-500' },
              known:   { t: 'Nắm chắc',   c: 'bg-emerald-100 text-emerald-700' } },
        retired(q) {
          const c = this.cards[q.id], R = this.RETIRE;
          return !!c && c.n >= R.n && c.box >= R.box && c.wrong / c.n <= R.err;
        },
        get nRetired() { return this.scopedItems.filter(q => this.retired(q)).length; },
        // Thanh "đã nắm chắc" ở màn hình đầu tính theo ĐÚNG tab đang mở (trắc nghiệm
        // hay thẻ) — gộp cả hai thì con số không khớp thứ đang nhìn (9 câu mà /17).
        get modeItems() { return this.mode === 'cards' ? this.scopedCards : this.scopedQuiz; },
        get modeRetired() { return this.modeItems.filter(q => this.retired(q)).length; },
        get scopedItems() {
          return [...this.scopedQuiz, ...this.scopedCards];
        },
        // Đếm khái niệm THỰC SỰ có bài trong phạm vi, không đếm cả cây. Nút trung
        // gian (unit, mục) và khái niệm chưa có nội dung đều không tính — nếu tính,
        // chọn mục nào cũng ra cùng một con số của toàn môn.
        get scopedConcepts() {
          return new Set(this.scopedItems.map(x => x.concept)).size;
        },

        // Làm trơn (+0.5/+1.0) là bắt buộc: thiếu nó thì một câu mới sai đúng
        // một lần (tỉ lệ 1,0) sẽ xếp trên một chủ đề yếu thật sai 6/10, và
        // danh sách "điểm yếu" biến thành danh sách "câu mới gặp một lần".
        score(q, now) {
          const c = this.cards[q.id];
          const err = c ? (c.wrong + 0.5) / (c.n + 1.0) : 0.5;
          const overdue = c ? Math.max(0, Math.min((now - c.due) / 86400, 14) / 14) : 0;
          const fresh = c && (now - c.last_ts) < 600 ? -2.0 : 0;
          const novel = !c || c.n === 0 ? 0.35 : 0;
          return 1.6 * err + 1.0 * overdue + 0.6 * this.conceptErr(q.concept) + novel + fresh;
        },
        KINDS: [
          { k: 'gloss',   t: '📖 Từ vựng',     on: 'bg-indigo-600 text-white border-indigo-600',  off: 'bg-white text-indigo-700 border-indigo-300' },
          { k: 'facts',   t: '✦ Điều cần nhớ', on: 'bg-sky-600 text-white border-sky-600',        off: 'bg-white text-sky-700 border-sky-300' },
          { k: 'list',    t: '☑ Danh sách',    on: 'bg-emerald-600 text-white border-emerald-600', off: 'bg-white text-emerald-700 border-emerald-300' },
          { k: 'watch',   t: '⚠ Dễ nhầm',      on: 'bg-amber-500 text-white border-amber-500',    off: 'bg-white text-amber-700 border-amber-300' },
          { k: 'exp',     t: '🔬 Thí nghiệm',  on: 'bg-violet-600 text-white border-violet-600',  off: 'bg-white text-violet-700 border-violet-300' },
          { k: 'worked',  t: '🧮 Bài mẫu',     on: 'bg-teal-600 text-white border-teal-600',      off: 'bg-white text-teal-700 border-teal-300' },
          { k: 'topics',  t: '① Nội dung thi', on: 'bg-orange-600 text-white border-orange-600', off: 'bg-white text-orange-700 border-orange-300' },
          { k: 'compare', t: '⇄ So sánh',      on: 'bg-slate-700 text-white border-slate-700',    off: 'bg-white text-slate-700 border-slate-300' },
        ],
        // ⚠ ĐỪNG đặt tên state này là `pick`: đã có method pick(c) chọn đáp án
        // trắc nghiệm, khoá sau ghi đè khoá trước trong object literal.
        toggleShow(k) { this.filt[k] = !this.filt[k]; localStorage.setItem('lms_pick', JSON.stringify(this.filt)); },
        get anyPick() { return Object.values(this.filt).some(Boolean); },
        // Hiển thị thật sự: chưa chọn gì thì hiện hết, chọn rồi thì chỉ hiện phần đã chọn.
        get show() {
          const on = this.anyPick;
          return Object.fromEntries(this.KINDS.map(kd => [kd.k, on ? !!this.filt[kd.k] : true]));
        },
        // Chip nào không có nội dung trong phạm vi đang xem thì ẩn hẳn: bấm vào
        // một bộ lọc rỗng chỉ làm trẻ tưởng trang hỏng. Tính theo scopedSummary
        // nên đổi phạm vi ở cây bên trái là chip tự hiện/ẩn theo.
        hasKind(k) {
          const F = { gloss: 'glossary', facts: null, list: 'checklists',
                      watch: 'watch_out', exp: 'experiments', worked: 'worked', topics: 'topics', compare: 'compares' };
          return this.scopedSummary.some(sec =>
            (k === 'facts' ? this.points(sec) : (sec[F[k]] || [])).length);
        },
        get kinds() { return this.KINDS.filter(kd => this.hasKind(kd.k)); },
        toggleDetail() { this.detail = !this.detail; localStorage.setItem('lms_detail', this.detail ? '1' : '0'); },

        // ── Phạm vi học ───────────────────────────────────────────────────────
        // Bấm vào Unit thì học cả Unit; bấm vào một mục con thì chỉ học mục đó.
        // Làm bằng cách lấy toàn bộ nhánh con của khái niệm được chọn.
        subtree(cid) {
          if (this._sub && this._sub[cid]) return this._sub[cid];
          const out = new Set([cid]);
          const walk = (id) => this.children(id).forEach(k => { out.add(k.id); walk(k.id); });
          walk(cid);
          (this._sub = this._sub || {})[cid] = out;
          return out;
        },
        inScope(cid) { return !this.scope || this.subtree(this.scope).has(cid); },
        setScope(cid) {
          this.scope = cid;
          this.navOpen = false;
          // Đang giữa phiên mà đổi phạm vi thì quay về màn hình bắt đầu, không
          // thì hàng đợi cũ vẫn chạy tiếp với nội dung ngoài phạm vi vừa chọn.
          if (this.screen !== 'start' && (this.mode === 'quiz' || this.mode === 'cards')) {
            this.screen = 'start';
          }
        },
        get scopeName() {
          if (!this.scope) return 'Cả môn';
          return this.label((this.data?.concepts || []).find(x => x.id === this.scope)) || this.scope;
        },
        get scopedQuiz() { return (this.data?.quiz || []).filter(q => this.inScope(q.concept)); },
        get scopedCards() { return (this.data?.flashcards || []).filter(q => this.inScope(q.concept)); },
        get scopedSummary() { return (this.data?.summary || []).filter(x => this.inScope(x.concept)); },

        // ── Cây khái niệm ──────────────────────────────────────────────────────
        // Cây, KHÔNG phải ảnh: tìm kiếm được, diff được trong git, và chính nó
        // là phân loại khái niệm mà conceptErr() cộng dồn lên.
        // Dùng ?. ở mọi getter: Alpine ĐÁNH GIÁ biểu thức trong x-show dù đang
        // ẩn, nên cây bên trái chạy trước khi fetch xong và data vẫn là null.
        children(pid) { return (this.data?.concepts || []).filter(c => c.parent === pid); },
        get roots() { return this.children(null); },
        // "Unit" = tầng ngay dưới gốc. Nếu cây chỉ có một gốc (một unit duy
        // nhất) thì lấy chính các con của nó, để menu không hiện đúng một dòng.
        get units() {
          const r = this.roots;
          return r.length === 1 ? this.children(r[0].id) : r;
        },
        // Số câu và tỉ lệ sai của một nhánh, tính gộp cả nhánh con
        branchStat(cid) {
          const out = { n: 0, wrong: 0, items: 0 };
          const walk = (id) => {
            for (const q of this.allItems) {
              if (q.concept !== id) continue;
              out.items++;
              const c = this.cards[q.id];
              if (c) { out.n += c.n; out.wrong += c.wrong; }
            }
            this.children(id).forEach(k => walk(k.id));
          };
          walk(cid);
          return out;
        },
        // Nhãn hiển thị: "2.1 Properties of substances". Số mục để RIÊNG trong
        // trường `no` chứ không nhét vào `en` — bảng khoá khái niệm tra theo `en`,
        // đổi nhãn là tách đôi lịch sử.
        // "Unit 2 — Materials…" cho unit, "2.1 Properties…" cho mục con.
        // Số mục đã tự mang dấu chấm nên đừng thêm dấu chấm nữa.
        label(c) {
          if (!c) return '';
          if (!c.no) return c.en;
          return c.no.includes('.') ? c.no + ' ' + c.en : 'Unit ' + c.no + ' — ' + c.en;
        },
        // Chấp nhận cả hai dạng: points_en là mảng chuỗi (bản cũ, môn khác),
        // points là mảng {t, icon}. Không ép migrate toàn bộ chỉ vì một môn.
        // Các khối tuỳ chọn — thí nghiệm, bảng, so sánh, dễ nhầm — là MẢNG: một lá
        // có thể có 0, 1 hay nhiều, tuỳ độ quan trọng. Nhận cả dạng cũ (một object)
        // để dữ liệu môn khác chưa gen lại vẫn hiện.
        arr(sec, many, one) { const a = sec[many]; if (Array.isArray(a)) return a; const o = sec[one]; return o ? [o] : []; },
        lists(sec, leafId)  { return this.arr(sec, 'checklists', 'checklist').filter(x => x.concept === leafId); },
        exps(sec, leafId)   { return this.arr(sec, 'experiments', 'from_the_book').filter(x => x.concept === leafId); },
        works(sec, leafId)  { return this.arr(sec, 'worked', null).filter(x => x.concept === leafId); },
        tops(sec)           { return (sec.topics || []); },
        comps(sec, leafId)  { return this.arr(sec, 'compares', 'compare').filter(x => x.concept === leafId); },
        // Khối cấp MỤC = không gắn lá nào
        secLists(sec) { return this.arr(sec, 'checklists', 'checklist').filter(x => !x.concept); },
        secExps(sec)  { return this.arr(sec, 'experiments', 'from_the_book').filter(x => !x.concept); },
        secComps(sec) { return this.arr(sec, 'compares', 'compare').filter(x => !x.concept); },
        // Lá của một mục = con trực tiếp của chủ đề mục đó, theo thứ tự cây
        leavesOf(sec) { return this.children(sec.concept); },
        tagged(list, leafId) { return (list || []).filter(x => x && x.concept === leafId); },
        // Mọi thứ KHÔNG gắn vào lá nào của mục — dữ liệu cũ, hoặc ý thuộc cả mục
        untagged(sec) {
          const ids = new Set(this.leavesOf(sec).map(l => l.id));
          const f = (list) => (list || []).filter(x => !x || !ids.has(x.concept));
          const r = { glossary: f(sec.glossary), points: f(this.points(sec)), watch: f(sec.watch_out) };
          r.any = r.glossary.length || r.points.length || r.watch.length
                  || this.secLists(sec).length || this.secExps(sec).length;
          return r;
        },
        // Tách câu đầu của "điều cần nhớ" để in đậm: theo SPEC câu đầu LÀ kiến thức,
        // phần sau chỉ giải thích. Bỏ qua dấu chấm của "°C." và trong "(p.36)".
        lead(t) {
          t = t || '';
          const re = /[.!?](?=\s|$)/g; let m;
          while ((m = re.exec(t))) {
            const i = m.index, before = t.slice(0, i);
            if (before.endsWith('°C') || /\(p\.[^)]*$/.test(before) || /\bp$/.test(before)) continue;
            return [t.slice(0, i + 1), t.slice(i + 1)];
          }
          return [t, ''];
        },
        points(sec) {
          if (Array.isArray(sec.points)) return sec.points;
          return (sec.points_en || []).map(t => ({ t, icon: 'cube' }));
        },
        conceptName(id) {
          const c = (this.data?.concepts || []).find(x => x.id === id);
          return this.label(c) || id;
        },
        go(m) { this.mode = m; this.screen = m === 'quiz' || m === 'cards' ? 'start' : m; },
        start(n) {
          this._cerr = {};                       // xoá bộ nhớ đệm mỗi phiên
          const now = Math.floor(Date.now() / 1000);
          const seen = [], fresh = [];
          const pool = this.poolItems;
          for (const q of pool) {
            (this.cards[q.id] && this.cards[q.id].n > 0 ? seen : fresh).push(q);
          }
          const by = (a, b) => this.score(b, now) - this.score(a, now);
          const act = seen.filter(q => !this.retired(q));
          const due = act.filter(q => this.cards[q.id].due <= now).sort(by);
          const rest = act.filter(q => this.cards[q.id].due > now).sort(by);
          // Câu đã thuộc chỉ vào hàng đợi khi ĐẾN HẠN; chưa tới hạn thì đứng ngoài hẳn.
          const retDue = seen.filter(q => this.retired(q) && this.cards[q.id].due <= now).sort(by);
          // 60/25/15 là ràng buộc ĐỘNG LỰC, không phải sư phạm: top-N thuần tạo
          // ra phiên mà đứa trẻ 10 tuổi sai 18/20 rồi bỏ. Tính năng không ai mở
          // thì hiệu quả bằng 0.
          const pick = [
            ...due.slice(0, Math.ceil(n * 0.60)),
            ...fresh.slice(0, Math.ceil(n * 0.25)),
          ];
          for (const q of [...due, ...retDue, ...rest, ...fresh]) {
            if (pick.length >= n) break;
            if (!pick.includes(q)) pick.push(q);
          }
          // Giãn sao cho hai câu liền nhau không cùng chủ đề, nếu xếp được
          const q0 = pick.sort(() => Math.random() - 0.5);
          for (let i = 1; i < q0.length; i++) {
            if (q0[i].concept !== q0[i - 1].concept) continue;
            const j = q0.findIndex((x, k) => k > i && x.concept !== q0[i - 1].concept);
            if (j > 0) [q0[i], q0[j]] = [q0[j], q0[i]];
          }
          this.queue = q0;
          this.at = 0; this.log = []; this.picked = null; this.answered = false;
          this.wrongAgain = 0; this.revealed = false; this.qStats = { n: 0, ok: 0 };
          this.screen = 'quiz'; this.shownAt = Date.now();
          this.autoRead(this.q?.stem_en);
        },
        get q() { return this.queue[this.at] || null; },
        // Xáo phương án mỗi lần hiện: bộ sinh hay dồn đáp án vào một chữ cái
        // (lô đầu 13/20 là "b"), xáo thì không đoán mò theo vị trí được. An toàn
        // vì id băm theo NỘI DUNG đáp án đúng, không theo chữ cái.
        get choices() {
          const q = this.q;
          if (!q) return [];
          if (!q._shuffled) {
            q._shuffled = [...q.choices].sort(() => Math.random() - 0.5);
          }
          return q._shuffled;
        },
        // Phải chịu được null: khối phản hồi dùng x-show nên Alpine vẫn đánh giá
        // isCorrect(picked) lúc chưa chọn gì.
        isCorrect(c) { return !!c && !!this.q && c.key === this.q.answer; },

        pick(c) {
          if (this.answered) return;
          this.picked = c; this.answered = true;
          const okAns = this.isCorrect(c);
          const now = Math.floor(Date.now() / 1000);
          const g = okAns ? (Date.now() - this.shownAt > 20000 ? 2 : 3) : 0;
          const q = this.q;
          const st = this.sched(q.id, this.cards[q.id], g, now);
          this.qStats.n++; if (okAns) this.qStats.ok++;
          this.log.push({
            i: q.id, c: q.concept, ok: okAns ? 1 : 0, g,
            ms: Date.now() - this.shownAt,
            x: okAns ? null : c.key,
            t: now, box: st.box, ease: st.ease, due: st.due,
          });
          // Cập nhật ngay tại chỗ để câu sau trong cùng phiên tính đúng
          const prev = this.cards[q.id] || { n: 0, wrong: 0, streak: 0 };
          this.cards[q.id] = {
            ...prev, ...st, n: prev.n + 1,
            wrong: prev.wrong + (okAns ? 0 : 1),
            streak: okAns ? prev.streak + 1 : 0, last_ts: now,
          };
          // Sai thì đẩy lại CUỐI hàng đợi ngay trong phiên, không đợi hôm sau.
          // Giới hạn 5 lần để một câu khó không kéo phiên dài vô tận.
          if (!okAns && this.wrongAgain < 5) { this.queue.push(q); this.wrongAgain++; }
          // Làm tuỳ ý, dừng lúc nào cũng được → lưu định kỳ, đừng đợi hết phiên.
          if (this.log.length >= 5) this.save();
        },
        finishQuiz() { this.save(); this.screen = 'done'; },
        next() {
          this.at++; this.picked = null; this.answered = false; this.shownAt = Date.now();
          if (this.at >= this.queue.length) { this.screen = 'done'; this.save(); }
          else this.autoRead(this.q?.stem_en);
        },
        get nDone() { return this.log.filter(x => x.ok).length; },

        // ── Đọc to ─────────────────────────────────────────────────────────────
        // Web Speech API của trình duyệt: không file audio, không request, không
        // hạn mức. Giọng là của thiết bị nên chất lượng tuỳ máy; đặt en-US để
        // chọn giọng Mỹ. Không có API thì ẩn nút, không báo lỗi.
        // Đọc to: gọi /api/tts (Worker proxy Google Cloud TTS, sinh lúc bấm, cache
        // ở edge) rồi phát MP3; lỗi hay không có API thì lùi về Web Speech của máy.
        // Mở file:// hoặc bản GitHub Pages thì không có /api → luôn Web Speech.
        get canSpeak() { return typeof window !== 'undefined' && ('speechSynthesis' in window || 'Audio' in window); },
        autoSpeak: localStorage.getItem('lms_autospeak') === '1',
        _player: null, _blobs: {},
        async speak(text) {
          text = (text || '').trim(); if (!text) return;
          if (this._player) { this._player.pause(); this._player = null; }
          if ('speechSynthesis' in window) window.speechSynthesis.cancel();
          try {
            let src = this._blobs[text];
            if (!src) {
              const r = await fetch(`/api/tts?user=${this.user}&course=${this.course}&text=${encodeURIComponent(text)}`);
              if (!r.ok) throw new Error('HTTP ' + r.status);
              src = this._blobs[text] = URL.createObjectURL(await r.blob());
            }
            this._player = new Audio(src);
            await this._player.play();
          } catch (e) { this.speakLocal(text); }
        },
        speakLocal(text) {
          if (!('speechSynthesis' in window)) return;
          const u = new SpeechSynthesisUtterance(text);
          u.lang = 'en-US'; u.rate = 0.9;
          const v = window.speechSynthesis.getVoices().find(x => /^en[-_]US/i.test(x.lang));
          if (v) u.voice = v;
          window.speechSynthesis.speak(u);
        },
        toggleAuto() {
          this.autoSpeak = !this.autoSpeak;
          localStorage.setItem('lms_autospeak', this.autoSpeak ? '1' : '0');
        },
        // Tự đọc mặt trước khi hiện thẻ/câu mới. Gọi sau khi state đã đổi.
        autoRead(text) { if (this.autoSpeak) setTimeout(() => this.speak(text), 50); },

        // ── Thẻ ghi nhớ: HỌC ───────────────────────────────────────────────────
        // Xem lần lượt, hiện cả hai mặt, không chấm. Thứ tự XÁO NGẪU NHIÊN mỗi lần
        // vào (không cố định theo cây, kẻo học thuộc theo vị trí), nhưng giữ nguyên
        // trong lúc lật qua lại; nút 🔀 xáo lại.
        learnList: [],
        get learnDeck() { return this.learnList; },
        shuffleLearn() {
          const a = [...this.pool('cards')];
          for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
          this.learnList = a; this.learnAt = 0;
          this.autoRead(this.learnCard?.front_en);
        },
        startLearn() { this.shuffleLearn(); this.screen = 'learn'; },
        get learnCard() { return this.learnDeck[this.learnAt] || null; },

        // ── Thẻ ghi nhớ: KIỂM TRA ──────────────────────────────────────────────
        // Quay vòng vô hạn. Mỗi lượt CHỌN NGẪU NHIÊN CÓ TRỌNG SỐ: thẻ vừa đánh
        // "cần kiểm tra lại" nặng hơn hẳn, thẻ "đã thuộc" nhẹ đi, thẻ chưa gặp
        // trong phiên thì dựa vào tỉ lệ sai đã lưu. Không lặp thẻ vừa hiện.
        weight(q) {
          const st = this.seen[q.id];
          if (st === 'again') return 4.0;
          if (st === 'known') return 0.25;
          if (this.retired(q)) return 0.15;
          const c = this.cards[q.id];
          const err = c ? (c.wrong + 0.5) / (c.n + 1.0) : 0.5;
          return 1.0 + 3.0 * err;
        },
        pickWeighted() {
          const src = this.pool('cards');
          let pool = src.filter(q => q.id !== this.lastId);
          if (!pool.length) pool = src;
          const total = pool.reduce((a, q) => a + this.weight(q), 0);
          let r = Math.random() * total;
          for (const q of pool) { r -= this.weight(q); if (r <= 0) return q; }
          return pool[pool.length - 1];
        },
        startTest() {
          this._cerr = {}; this.seen = {}; this.tStats = { n: 0, known: 0 };
          this.lastId = null; this.log = []; this.revealed = false;
          this.queue = [this.pickWeighted()]; this.at = 0;
          this.shownAt = Date.now(); this.screen = 'test';
          this.autoRead(this.q?.front_en);
        },
        // known=true → điểm 3 ("Đã thuộc"), false → điểm 0 ("Cần kiểm tra lại").
        // Cùng thang với trắc nghiệm nên D1 và lịch ôn giãn cách dùng chung.
        // Đã thuộc → chấm 3 và sang thẻ kế ngay. Xem đáp án → chấm 0, lật thẻ, chờ
        // bấm Tiếp theo. Chấm ngay lúc bấm (không đợi Tiếp theo) để đóng tab giữa
        // chừng cũng không mất lượt: log đã có, save() định kỳ sẽ đẩy.
        markKnown() { this.grade(true); this.advance(); },
        reveal() { if (this.revealed) return; this.revealed = true; this.grade(false); },
        grade(known) {
          const g = known ? 3 : 0;
          const now = Math.floor(Date.now() / 1000);
          const q = this.q;
          const st = this.sched(q.id, this.cards[q.id], g, now);
          this.log.push({ i: q.id, c: q.concept, ok: known ? 1 : 0, g,
                          ms: Date.now() - this.shownAt, x: null,
                          t: now, box: st.box, ease: st.ease, due: st.due });
          const prev = this.cards[q.id] || { n: 0, wrong: 0, streak: 0 };
          this.cards[q.id] = { ...prev, ...st, n: prev.n + 1,
                               wrong: prev.wrong + (known ? 0 : 1),
                               streak: known ? prev.streak + 1 : 0, last_ts: now };
          this.seen[q.id] = known ? 'known' : 'again';
          this.tStats.n++; if (known) this.tStats.known++;
          this.lastId = q.id;
          if (this.log.length >= 5) this.save();   // lưu định kỳ: vòng vô hạn không có "kết thúc" để chờ
        },
        advance() {
          this.queue = [this.pickWeighted()]; this.at = 0;
          this.revealed = false; this.shownAt = Date.now();
          this.autoRead(this.q?.front_en);
        },
        get nAgain() { return Object.values(this.seen).filter(v => v === 'again').length; },
        get nUnseen() { return this.scopedCards.filter(q => !this.seen[q.id]).length; },
        finishTest() { this.save(); this.screen = 'done'; },

        // ── Thẻ ghi nhớ (cũ) ──────────────────────────────────────────────────
        // Người học tự chấm 0..3 (Lại / Khó / Được / Dễ) — cùng thang điểm với
        // trắc nghiệm nên dùng chung sched() và chung lịch sử trong D1.
        rate(g) {
          if (!this.revealed) return;
          const now = Math.floor(Date.now() / 1000);
          const q = this.q;
          const st = this.sched(q.id, this.cards[q.id], g, now);
          const okAns = g >= 2;
          this.log.push({ i: q.id, c: q.concept, ok: okAns ? 1 : 0, g,
                          ms: Date.now() - this.shownAt, x: null,
                          t: now, box: st.box, ease: st.ease, due: st.due });
          const prev = this.cards[q.id] || { n: 0, wrong: 0, streak: 0 };
          this.cards[q.id] = { ...prev, ...st, n: prev.n + 1,
                               wrong: prev.wrong + (okAns ? 0 : 1),
                               streak: okAns ? prev.streak + 1 : 0, last_ts: now };
          if (!okAns && this.wrongAgain < 5) { this.queue.push(q); this.wrongAgain++; }
          this.revealed = false;
          this.at++; this.shownAt = Date.now();
          if (this.at >= this.queue.length) { this.screen = 'done'; this.save(); }
        },

        // ── Ghi kết quả ───────────────────────────────────────────────────────
        // Đệm vào localStorage TRƯỚC khi gửi. Mất mạng ở câu 19 mà mất cả phiên
        // là mất đúng thứ có giá trị nhất của tính năng này.
        buf() { try { return JSON.parse(localStorage.getItem('lms_study_buf') || '[]'); } catch { return []; } },
        async save() {
          if (!this.log.length) return;
          const pending = [...this.buf(), ...this.log];
          this.log = [];   // ĐÃ chuyển sang buffer — không xoá thì lần save sau ghi trùng
          localStorage.setItem('lms_study_buf', JSON.stringify(pending));
          await this.flushBuffer();
        },
        async flushBuffer() {
          const pending = this.buf();
          if (!pending.length || !this.online || !this.secret) return;
          try {
            const r = await fetch(`/api/study?user=${this.user}&course=${this.course}`, {
              method: 'POST',
              headers: { 'content-type': 'application/json', 'x-progress-key': this.secret },
              body: JSON.stringify({ attempts: pending }),
            });
            if (r.status === 401) {
              this.secret = ''; localStorage.removeItem('lms_key');
              throw new Error('Mã bí mật không đúng');
            }
            if (!r.ok) throw new Error('HTTP ' + r.status);
            localStorage.removeItem('lms_study_buf');   // chỉ xoá khi CHẮC đã ghi
            this.err = '';
          } catch (e) {
            this.err = 'Chưa lưu được kết quả — sẽ thử lại lần sau. (' + e.message + ')';
          }
        },
        // Chủ đề yếu nhất, ngưỡng n>=2 để không kết luận từ một lần sai
        weakConcepts() {
          const by = {};
          for (const q of this.allItems) {
            const c = this.cards[q.id];
            if (!c || !c.n) continue;
            (by[q.concept] = by[q.concept] || { id: q.concept, n: 0, wrong: 0 });
            by[q.concept].n += c.n; by[q.concept].wrong += c.wrong;
          }
          return Object.values(by).filter(x => x.n >= 2 && x.wrong > 0)
            .sort((a, b) => (b.wrong + 1) / (b.n + 3) - (a.wrong + 1) / (a.n + 3))
            .slice(0, 3);
        },
        async askSecret() {
          const v = (prompt('Nhập mã bí mật để lưu kết quả ôn tập:') || '').trim();
          if (!v) return;
          this.secret = v; localStorage.setItem('lms_key', v);
          await this.flushBuffer();
        },
      };
    }
  </script>
</head>
<!-- KHÔNG thêm x-init="init()": Alpine 3 TỰ gọi phương thức init() của object
     x-data. Thêm nữa là chạy hai lần — hai lượt GET và, tệ hơn, hai lượt POST
     ghi trùng cả phiên vào D1. (course.html không dính vì init nằm trong object
     con `p` chứ không phải gốc x-data.) -->
<body class="bg-slate-100 text-slate-800 min-h-screen"
      x-data="studyStore('pl', 'cie-science-5')">

       SVG nội tuyến, không gọi ảnh ngoài: không thêm request, phóng to không vỡ,
       và mở bằng file:// vẫn hiện. Định nghĩa một lần trong <defs>, chỗ dùng chỉ
       tham chiếu bằng <use> — JSON chỉ mang TÊN biểu tượng, không mang markup.  -->
  <svg class="hidden" aria-hidden="true"><defs>

      <path d="M12 3l8 4.5v9L12 21l-8-4.5v-9L12 3z"/><path d="M4 7.5l8 4.5 8-4.5M12 12v9"/></g>

      <path d="M12 2v20M4 7l16 10M20 7L4 17"/><path d="M12 6l-2-2m2 2l2-2m-2 14l-2 2m2-2l2 2"/></g>
    <g id="i-fire" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round">
      <path d="M12 3s5 4 5 9a5 5 0 01-10 0c0-2 1-3 1-3s1 2 2 2c1.5 0 1-4 2-8z"/></g>

      <path d="M6 16a4 4 0 011-7.9A5 5 0 0117 8a3.5 3.5 0 011 6.9"/><path d="M8 20v1M12 19v2M16 20v1"/></g>
    <g id="i-scale" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">

    <!-- Dòng nhiệt chảy sang phải. KHÔNG thêm vạch đứng ở cuối: mũi tên đâm vào
         vạch đọc ra là "bị chặn", ngược hẳn nghĩa cần diễn đạt. -->
    <g id="i-heat" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 12h15m0 0l-4-4m4 4l-4 4"/><path d="M4 7h8M4 17h8"/></g>
    <g id="i-bar" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round">
      <rect x="3" y="9" width="18" height="6" rx="1.5"/><path d="M8 9v6M13 9v6"/></g>
    <g id="i-bolt" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round">
      <path d="M13 3L5 13h6l-1 8 8-10h-6l1-8z"/></g>
    <g id="i-shield" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round">
      <path d="M12 3l7 3v6c0 4-3 7-7 9-4-2-7-5-7-9V6l7-3z"/></g>
    <g id="i-swap" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M5 9h14l-3-3M19 15H5l3 3"/></g>
    <g id="i-beaker" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round">
      <path d="M9 3h6M10 3v6l-5 9a2 2 0 002 3h10a2 2 0 002-3l-5-9V3"/><path d="M7 15h10"/></g>
    <g id="i-drop" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round">

  <nav x-show="ready && data" x-cloak class="bg-white border-b border-slate-200 sticky top-0 z-20">

         ghi đè display:none mà x-show đặt. Không dùng window.innerWidth trong

    <aside x-show="navOpen" x-cloak

                    class="w-full text-left px-4 py-3 rounded-lg border transition-colors"
                    :class="!answered ? 'bg-white border-slate-300 hover:border-indigo-500 hover:bg-indigo-50'
                            : (isCorrect(c) ? 'bg-emerald-50 border-emerald-400'
                               : (picked === c ? 'bg-rose-50 border-rose-400' : 'bg-white border-slate-200 opacity-60'))">
              <span class="text-sm text-slate-800" x-text="c.en"></span>
              <span x-show="c.vi" class="block text-xs text-slate-500" x-text="c.vi"></span>
            </button>
          </template>
        </div>
      </div>

      <div x-show="answered" x-cloak class="bg-white rounded-xl shadow-sm border border-slate-200 p-5">
        <p class="font-medium" :class="isCorrect(picked) ? 'text-emerald-700' : 'text-rose-700'"
           x-text="isCorrect(picked) ? '✓ Đúng rồi!' : '✗ Chưa đúng'"></p>
        <p class="mt-1 text-sm text-slate-700" x-text="q.why_en"></p>
        <p x-show="q.why_vi" class="mt-0.5 text-sm text-slate-500" x-text="q.why_vi"></p>
        <button @click="next()"
                class="mt-4 px-4 py-2 text-sm font-medium rounded-lg bg-indigo-600 text-white hover:bg-indigo-700">
          Câu tiếp →
        </button>
      </div>
    </div>
    </template>

    <!-- ── Thẻ ghi nhớ: HỌC ─────────────────────────────────────────────── -->
    <template x-if="screen === 'learn' && learnCard">
    <div class="space-y-4">
      <div class="flex items-center gap-3 text-xs text-slate-500">
        <div class="flex-1 h-1.5 rounded-full bg-slate-200 overflow-hidden">
          <div class="h-full bg-indigo-500 transition-all duration-300"
               :style="'width:' + Math.round((learnAt + 1) / learnDeck.length * 100) + '%'"></div>
        </div>
        <span x-text="(learnAt + 1) + '/' + learnDeck.length"></span>
      </div>
      <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6">
        <p class="text-xs text-slate-400" x-text="conceptName(learnCard.concept)"></p>
        <p class="mt-2 text-lg font-medium text-slate-900"><span x-text="learnCard.front_en"></span><button x-show="canSpeak" @click.stop="speak(learnCard.front_en)" type="button" title="Đọc to"
                        class="ml-1 inline-flex items-center justify-center w-6 h-6 rounded-full text-indigo-500 hover:bg-indigo-100 align-middle">🔊</button></p>
        <div class="mt-4 pt-4 border-t border-slate-100">
          <p class="text-slate-700" x-text="learnCard.back_en"></p>
          <p x-show="learnCard.example_en" class="mt-2 text-sm text-slate-500 italic" x-text="learnCard.example_en"></p>
        </div>
      </div>
      <div class="flex gap-2">
        <button @click="learnAt = Math.max(0, learnAt - 1); autoRead(learnCard?.front_en)" :disabled="learnAt === 0"
                class="px-4 py-2 text-sm font-medium rounded-lg bg-white border border-slate-300 text-slate-700 hover:border-indigo-500 disabled:opacity-40">← Trước</button>
        <button x-show="learnAt < learnDeck.length - 1" @click="learnAt++; autoRead(learnCard?.front_en)"
                class="flex-1 px-4 py-2 text-sm font-medium rounded-lg bg-indigo-600 text-white hover:bg-indigo-700">Tiếp →</button>
        <button x-show="learnAt >= learnDeck.length - 1" x-cloak @click="startTest()"
                class="flex-1 px-4 py-2 text-sm font-medium rounded-lg bg-emerald-600 text-white hover:bg-emerald-700">✍️ Bắt đầu kiểm tra</button>
        <button @click="shuffleLearn()" title="Xáo lại" class="px-3 py-2 text-sm text-slate-500 hover:text-indigo-600">🔀</button>
        <button @click="screen = 'start'" class="px-3 py-2 text-sm text-slate-500 hover:text-indigo-600">Thoát</button>
      </div>
    </div>
    </template>

    <!-- ── Thẻ ghi nhớ: KIỂM TRA (quay vòng vô hạn, ngẫu nhiên có trọng số) ── -->
    <template x-if="screen === 'test' && q">
    <div class="space-y-4">
      <div class="flex items-center justify-between text-xs text-slate-500">
        <span><span class="font-semibold text-slate-700" x-text="tStats.known"></span>/<span x-text="tStats.n"></span> đã thuộc</span>
        <span><span class="font-semibold text-rose-600" x-text="nAgain"></span> cần xem lại · <span x-text="nUnseen"></span> chưa gặp</span>
      </div>
      <!-- Bấm vào thẻ để lật -->
      <!-- Bấm vào thẻ = "Xem đáp án" (chấm 0, lật). div role=button chứ không
           phải <button>: bên trong có nút loa, <button> lồng nhau là HTML sai. -->
      <div role="button" tabindex="0" @click="reveal()" @keydown.enter="reveal()"
           class="w-full text-left bg-white rounded-xl shadow-sm border border-slate-200 p-6 min-h-44 flex flex-col transition-colors"
           :class="revealed ? 'border-rose-200 cursor-default' : 'cursor-pointer hover:border-indigo-400'">
        <p class="text-xs text-slate-400" x-text="conceptName(q.concept)"></p>
        <p class="mt-2 text-lg font-medium text-slate-900"><span x-text="q.front_en"></span><button x-show="canSpeak" @click.stop="speak(q.front_en)" type="button" title="Đọc to"
                        class="ml-1 inline-flex items-center justify-center w-6 h-6 rounded-full text-indigo-500 hover:bg-indigo-100 align-middle">🔊</button></p>
        <div x-show="revealed" x-cloak class="mt-4 pt-4 border-t border-slate-100">
          <p class="text-slate-700" x-text="q.back_en"></p>
          <p x-show="q.example_en" class="mt-2 text-sm text-slate-500 italic" x-text="q.example_en"></p>
        </div>
      </div>
      <!-- Hai nút hiện SẴN. Bấm một trong hai thì đổi thành Tiếp theo (Đã thuộc
           thì sang luôn nên thực tế Tiếp theo chỉ xuất hiện sau Xem đáp án). -->
      <div x-show="!revealed" class="grid grid-cols-2 gap-2">
        <button @click="reveal()"     class="px-3 py-3 text-sm font-medium rounded-lg bg-rose-100 text-rose-700 hover:bg-rose-200">👁 Xem đáp án</button>
        <button @click="markKnown()"  class="px-3 py-3 text-sm font-medium rounded-lg bg-emerald-100 text-emerald-700 hover:bg-emerald-200">✓ Đã thuộc</button>
      </div>
      <div x-show="revealed" x-cloak>
        <button @click="advance()" class="w-full px-3 py-3 text-sm font-medium rounded-lg bg-indigo-600 text-white hover:bg-indigo-700">Tiếp theo →</button>
      </div>
      <div class="text-center">
        <button @click="finishTest()" class="text-sm text-slate-500 hover:text-indigo-600 underline">Kết thúc</button>
      </div>
    </div>
    </template>

    <!-- ── Tóm tắt dạng trực quan ────────────────────────────────────────
         Không dựng tên class từ JSON: Tailwind quét HTML lúc build, class ghép
         chuỗi sẽ bị cắt mất. JSON chỉ mang TÊN biểu tượng và TÊN sơ đồ; markup
         nằm sẵn ở đây.                                                        -->
    <template x-if="ready && data && mode === 'summary'">
    <div class="space-y-5">
      <!-- Lọc loại nội dung + bật chi tiết. Class ở KINDS là literal để Tailwind quét thấy. -->
      <div class="flex flex-wrap items-center gap-1.5">
        <template x-for="kd in kinds" :key="kd.k">
          <button @click="toggleShow(kd.k)" :class="filt[kd.k] ? kd.on : kd.off"
                  class="px-2.5 py-1 text-xs font-medium rounded-full border transition-colors" x-text="kd.t"></button>
        </template>
        <label class="ml-auto flex items-center gap-1.5 text-xs text-slate-600 cursor-pointer select-none">
          <input type="checkbox" :checked="detail" @change="toggleDetail()" class="accent-indigo-600"> Chi tiết
        </label>
      </div>
      <p x-show="!scopedSummary.length" x-cloak
         class="rounded-lg bg-slate-50 border border-slate-200 px-4 py-3 text-sm text-slate-500">
        Chưa có tóm tắt cho phần này.
      </p>

      <template x-for="sec in scopedSummary" :key="sec.concept">
        <section class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
          <div class="px-5 py-3 bg-indigo-50 border-b border-indigo-100">
            <h3 class="text-lg font-bold text-indigo-900" x-text="conceptName(sec.concept)"></h3>
          </div>

          <!-- Ý lớn: một câu, chữ to, để nhớ được cả mục -->
          <p x-show="sec.big_en" x-cloak
             class="px-5 py-4 text-base font-medium text-slate-800 leading-snug" x-text="sec.big_en"></p>

          <!-- ── Sơ đồ: ba trạng thái của chất, theo mô hình hạt ────────────
               Vẽ thẳng, KHÔNG dùng x-for: <template> bên trong <svg> nằm ở không
               gian tên SVG nên không phải HTMLTemplateElement, Alpine không clone
               được và ném "importNode: parameter 1 is not of type 'Node'".      -->
          <div x-show="sec.diagram === 'particles'" x-cloak class="px-5 pb-4">
            <div class="grid grid-cols-3 gap-2 text-center">
              <div class="rounded-lg border border-slate-200 bg-slate-50 p-2">
                <svg viewBox="0 0 24 24" class="w-full h-16 text-indigo-600" fill="currentColor"><circle cx="6" cy="6" r="2.1"/><circle cx="12" cy="6" r="2.1"/><circle cx="18" cy="6" r="2.1"/><circle cx="6" cy="12" r="2.1"/><circle cx="12" cy="12" r="2.1"/><circle cx="18" cy="12" r="2.1"/><circle cx="6" cy="18" r="2.1"/><circle cx="12" cy="18" r="2.1"/><circle cx="18" cy="18" r="2.1"/></svg>
                <p class="mt-1 text-xs font-semibold text-slate-700">Solid</p>
                <p class="text-[11px] text-slate-500">packed, fixed</p>
              </div>
              <div class="rounded-lg border border-slate-200 bg-slate-50 p-2">
                <svg viewBox="0 0 24 24" class="w-full h-16 text-sky-500" fill="currentColor"><circle cx="6" cy="7" r="2.1"/><circle cx="13" cy="6" r="2.1"/><circle cx="19" cy="9" r="2.1"/><circle cx="7" cy="13" r="2.1"/><circle cx="14" cy="12" r="2.1"/><circle cx="19" cy="16" r="2.1"/><circle cx="6" cy="18" r="2.1"/><circle cx="13" cy="19" r="2.1"/></svg>
                <p class="mt-1 text-xs font-semibold text-slate-700">Liquid</p>
                <p class="text-[11px] text-slate-500">close, sliding</p>
              </div>
              <div class="rounded-lg border border-slate-200 bg-slate-50 p-2">
                <svg viewBox="0 0 24 24" class="w-full h-16 text-amber-500" fill="currentColor"><circle cx="5" cy="5" r="2.1"/><circle cx="17" cy="7" r="2.1"/><circle cx="10" cy="11" r="2.1"/><circle cx="20" cy="14" r="2.1"/><circle cx="6" cy="17" r="2.1"/><circle cx="14" cy="19" r="2.1"/></svg>
                <p class="mt-1 text-xs font-semibold text-slate-700">Gas</p>
                <p class="text-[11px] text-slate-500">far apart, fast</p>
              </div>
            </div>
            <div class="mt-2 flex justify-around text-[11px] text-slate-500">
              <span>← freezing · melting →</span>
              <span>← condensing · boiling →</span>
            </div>
          </div>

          <!-- ── Sơ đồ: dẫn nhiệt / cách nhiệt ────────────────────────────── -->
          <div x-show="sec.diagram === 'conduction'" x-cloak class="px-5 pb-4 space-y-2">
            <div class="flex items-center gap-2 rounded-lg border border-emerald-200 bg-emerald-50 px-3 py-2">
              <span class="text-xs font-semibold text-emerald-800 w-16 shrink-0">Metal</span>
              <svg class="w-5 h-5 text-emerald-600 shrink-0"><use href="#i-heat"/></svg>
              <span class="flex-1 h-2 rounded-full bg-gradient-to-r from-rose-400 to-amber-300"></span>
              <span class="text-xs text-emerald-800 shrink-0">heat passes</span>
            </div>
            <div class="flex items-center gap-2 rounded-lg border border-slate-200 bg-slate-50 px-3 py-2">
              <span class="text-xs font-semibold text-slate-700 w-16 shrink-0">Plastic</span>
              <svg class="w-5 h-5 text-slate-400 shrink-0"><use href="#i-shield"/></svg>
              <span class="flex-1 h-2 rounded-full bg-gradient-to-r from-rose-400 via-slate-300 to-slate-200"></span>
              <span class="text-xs text-slate-500 shrink-0">heat blocked</span>
            </div>
          </div>

          <!-- ── Sơ đồ: đảo ngược được / không đảo ngược được ─────────────── -->
          <div x-show="sec.diagram === 'reversible'" x-cloak class="px-5 pb-4 space-y-2">
            <div class="flex items-center justify-center gap-3 rounded-lg border border-emerald-200 bg-emerald-50 px-3 py-3">
              <span class="text-sm font-medium text-slate-800">Ice</span>
              <svg class="w-6 h-6 text-emerald-600"><use href="#i-swap"/></svg>
              <span class="text-sm font-medium text-slate-800">Water</span>
              <span class="text-xs text-emerald-700 ml-1">reversible</span>
            </div>
            <div class="flex items-center justify-center gap-3 rounded-lg border border-rose-200 bg-rose-50 px-3 py-3">
              <span class="text-sm font-medium text-slate-800">Flour + eggs</span>
              <svg class="w-6 h-6 text-rose-500"><use href="#i-arrow"/></svg>
              <span class="text-sm font-medium text-slate-800">Cake</span>
              <span class="text-xs text-rose-700 ml-1">no way back</span>
            </div>
          </div>

          <!-- ── Sơ đồ: chất tham gia → sản phẩm ──────────────────────────── -->
          <div x-show="sec.diagram === 'reaction'" x-cloak class="px-5 pb-4">
            <div class="flex items-center gap-2 flex-wrap justify-center rounded-lg border border-slate-200 bg-slate-50 px-3 py-3">
              <template x-for="r in ['Iron', 'Water', 'Oxygen']" :key="r">
                <span class="px-2 py-1 text-xs rounded bg-white border border-slate-300 text-slate-700" x-text="r"></span>
              </template>
              <svg class="w-6 h-6 text-indigo-500 mx-1"><use href="#i-arrow"/></svg>
              <span class="px-2 py-1 text-xs rounded bg-amber-100 border border-amber-300 text-amber-800 font-medium">Rust</span>
            </div>
            <p class="mt-1.5 text-center text-[11px] text-slate-500">reactants → product (new substance)</p>
          </div>

          <!-- ── Nội dung xếp THEO LÁ ─────────────────────────────────────────
               Mỗi tiểu mục của sách (= một lá trong cây bên trái) là một khối:
               từ vựng → ý → checklist → ngộ nhận → thí nghiệm của riêng lá đó.
               Trải phẳng thì người đọc không thấy cấu trúc sách; xếp theo lá thì
               infographic và cây điều hướng nói cùng một ngôn ngữ.                -->
          <!-- ── Nội dung thi (môn Toán) ────────────────────────────────────
               Mỗi kiến thức MỘT THẺ ĐÁNH SỐ: quy tắc bên trái, ví dụ ngay bên
               phải. Trước đây quy tắc nằm ở "Điều cần nhớ" còn ví dụ ở tận khối
               "Bài mẫu" phía dưới — đọc phải nhảy qua lại, học sinh không nối
               được hai thứ với nhau. Ví dụ có 3 dạng, xem study/SPEC.md.       -->
          <template x-if="show.topics && tops(sec).length"><div class="px-5 pb-4 space-y-3">
          <template x-for="(tp, ti) in tops(sec)" :key="'t' + ti">
            <div class="rounded-xl border border-orange-200 overflow-hidden">
              <div class="flex items-center gap-2 px-3 py-2 bg-orange-50 border-b border-orange-200">
                <span class="shrink-0 w-6 h-6 rounded-full bg-orange-500 text-white text-xs font-bold grid place-items-center"
                      x-text="ti + 1"></span>
                <h4 class="text-base font-bold text-orange-800 uppercase tracking-wide" x-text="tp.title"></h4>
                <span x-show="tp.subtitle" class="text-xs text-orange-500 normal-case" x-text="'(' + tp.subtitle + ')'"></span>
                <span class="ml-auto text-xs text-slate-400" x-text="tp.page ? 'p.' + tp.page : ''"></span>
              </div>
              <!-- Định nghĩa: infographic này để TỔNG HỢP kiến thức, không chỉ liệt kê
                   nội dung sẽ thi — nên mỗi thẻ mở đầu bằng một câu "cái này là gì". -->
              <p x-show="tp.def" class="px-3 pt-2.5 text-sm font-medium text-slate-900" x-text="tp.def"></p>
              <div class="grid sm:grid-cols-2 gap-x-4 gap-y-2 px-3 py-2.5">
                <div class="flex gap-3 self-start">
                <template x-if="tp.figure">
                  <svg viewBox="0 0 24 24" class="w-14 h-14 shrink-0 text-orange-400"><use :href="'#m-' + tp.figure"/></svg>
                </template>
                <ul class="space-y-1 text-sm text-slate-700 self-start">
                  <template x-for="(r, ri) in (tp.rules || [])" :key="ri">
                    <li class="flex gap-2"><span class="text-orange-400 shrink-0">•</span><span x-text="r"></span></li>
                  </template>
                </ul>
                </div>
                <!-- ví dụ: 3 dạng, class viết literal để Tailwind quét thấy -->
                <template x-if="tp.example && tp.example.kind === 'calc'">
                  <div class="rounded-lg bg-slate-50 border border-slate-200 px-3 py-2">
                    <p x-show="tp.example.title" class="text-xs font-semibold text-slate-500 mb-1" x-text="tp.example.title"></p>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-x-4 text-sm tabular-nums text-slate-800">
                      <template x-for="(ln, li) in tp.example.lines" :key="li"><p x-text="ln"></p></template>
                    </div>
                  </div>
                </template>
                <template x-if="tp.example && tp.example.kind === 'grid'">
                  <div class="overflow-x-auto rounded-lg border border-slate-200">
                    <table class="w-full text-center text-xs tabular-nums">
                      <tbody>
                        <template x-for="(row, ri) in tp.example.rows" :key="ri">
                          <tr :class="ri === 0 ? 'bg-slate-100 font-semibold text-slate-600'
                                     : (ri === tp.example.rows.length - 1 ? 'bg-orange-50 font-bold text-orange-700' : 'text-slate-700')">
                            <template x-for="(cell, ci) in row" :key="ci">
                              <td class="px-1 py-1 border border-slate-200 whitespace-nowrap" x-text="cell"></td>
                            </template>
                          </tr>
                        </template>
                      </tbody>
                    </table>
                  </div>
                </template>
                <template x-if="tp.example && tp.example.kind === 'ifthen'">
                  <div class="space-y-1.5">
                    <template x-for="(br, bi) in tp.example.branches" :key="bi">
                      <div class="rounded-lg bg-slate-50 border border-slate-200 px-3 py-1.5 text-sm">
                        <p class="text-slate-800"><span x-text="br.when"></span>
                          <span class="text-orange-500 font-bold"> → </span><span x-text="br.then"></span></p>
                        <p x-show="br.eg" class="text-xs text-slate-500 tabular-nums" x-text="br.eg"></p>
                      </div>
                    </template>
                  </div>
                </template>
              </div>
            </div>
          </template>
          </div></template>

          <!-- Từ vựng GỘP CHUNG cho mục có thẻ "nội dung thi": chia theo lá thì
               tiêu đề lá lặp lại y hệt tiêu đề thẻ ở trên, đọc rất rối. -->
          <template x-if="show.gloss && tops(sec).length && (sec.glossary || []).length">
          <div class="px-5 pb-4">
            <p class="text-[13px] font-bold uppercase tracking-wider text-indigo-600 mb-1.5">📖 Từ vựng</p>
            <dl class="grid sm:grid-cols-2 gap-2">
              <template x-for="g in (sec.glossary || [])" :key="g.term">
                <div class="rounded-lg border border-indigo-200 bg-indigo-50/40 px-3 py-2 flex gap-2.5">
                  <template x-if="g.icon">
                    <svg viewBox="0 0 24 24" class="w-7 h-7 shrink-0 mt-0.5 text-indigo-400"><use :href="'#m-' + g.icon"/></svg>
                  </template>
                  <div class="min-w-0">
                  <dt class="text-sm font-semibold text-indigo-900"><span x-text="g.term"></span><button x-show="canSpeak" @click.stop="speak(g.term)" type="button" title="Đọc to"
                      class="ml-1 align-middle text-indigo-400 hover:text-indigo-700">🔊</button></dt>
                  <dd class="text-sm text-slate-700 leading-snug" x-text="g.def"></dd>
                  <dd x-show="g.example" class="mt-0.5 text-xs text-slate-500 italic" x-text="g.example"></dd>
                  </div>
                </div>
              </template>
            </dl>
          </div>
          </template>

          <template x-for="leaf in (tops(sec).length ? [] : leavesOf(sec))" :key="leaf.id">
            <div class="mx-5 mb-4 rounded-xl border border-slate-200 overflow-hidden">
              <div class="flex items-center gap-2 px-4 py-2 bg-slate-50 border-b border-slate-200">
                <span class="w-2 h-2 rounded-full shrink-0"
                      :class="branchStat(leaf.id).wrong > 0 ? 'bg-rose-400' : 'bg-indigo-400'"></span>
                <h4 class="text-base font-bold text-slate-800" x-text="leaf.en"></h4>
                <span class="ml-auto text-xs text-slate-400" x-text="leaf.pages ? 'p.' + leaf.pages : ''"></span>
              </div>

              <!-- từ vựng của lá -->
              <template x-if="show.gloss && tagged(sec.glossary, leaf.id).length">
              <div class="px-4 pt-3">
              <p class="text-[13px] font-bold uppercase tracking-wider text-indigo-600 mb-1.5">📖 Từ vựng</p>
              <dl class="grid gap-x-3 gap-y-1.5 sm:grid-cols-2">
                <template x-for="g in tagged(sec.glossary, leaf.id)" :key="g.term">
                  <div class="rounded-lg bg-indigo-50/60 border border-indigo-100 px-3 py-2">
                    <dt class="text-sm font-semibold text-indigo-900"><span x-text="g.term"></span><button x-show="canSpeak" @click.stop="speak(g.term)" type="button" title="Đọc to"
                        class="ml-1 inline-flex items-center justify-center w-6 h-6 rounded-full text-indigo-500 hover:bg-indigo-100 align-middle">🔊</button></dt>
                    <dd class="text-sm text-slate-700 leading-snug" x-text="g.def"></dd>
                    <dd x-show="g.example" class="mt-0.5 text-xs text-slate-500 italic" x-text="g.example"></dd>
                  </div>
                </template>
              </dl>
              </div>
              </template>

              <!-- ý của lá -->
              <template x-if="show.facts && tagged(points(sec), leaf.id).length">
              <div class="px-4 pt-3">
              <p class="text-[13px] font-bold uppercase tracking-wider text-sky-600 mb-1.5">✦ Điều cần nhớ</p>
              <div class="grid gap-2 sm:grid-cols-2">
                <template x-for="(pt, i) in tagged(points(sec), leaf.id)" :key="i">
                  <div class="flex gap-2.5 rounded-lg border border-sky-200 bg-sky-50/40 p-3">
                    <p class="text-sm text-slate-700 leading-snug flex-1"><span class="font-semibold text-slate-900" x-text="lead(pt.t)[0]"></span><span x-text="lead(pt.t)[1]"></span></p>
                    <template x-if="pt.image"><img :src="'study/img/' + pt.image" alt="" class="w-16 shrink-0 self-start rounded border border-sky-200 bg-white object-contain"></template>
                  </div>
                </template>
              </div>
              </div>
              </template>

              <!-- bảng/danh sách thuộc lá: có thể nhiều; mỗi mục một dòng, ví dụ khi bật Chi tiết -->
              <template x-if="show.list"><div>
              <template x-for="(ck, ci) in lists(sec, leaf.id)" :key="'l' + ci">
              <div class="px-4 pt-3">
                <p class="text-[13px] font-bold uppercase tracking-wider text-emerald-700 mb-1.5">☑ <span x-text="ck.title"></span></p>
                <ol class="grid gap-1.5 sm:grid-cols-2">
                  <template x-for="(it, i) in ck.items" :key="i">
                    <li class="flex items-start gap-2 rounded-lg border border-emerald-200 bg-emerald-50/60 px-2.5 py-1.5">
                      <div class="min-w-0 text-sm leading-snug">
                        <span class="font-semibold text-slate-900" x-text="it.sign"></span>
                        <template x-if="it.look_for"><span><span class="text-slate-500"> — </span><span class="text-slate-700" x-text="it.look_for"></span></span></template>
                        <p x-show="detail && it.book_example" class="text-xs text-slate-500 italic" x-text="it.book_example"></p>
                      </div>
                    </li>
                  </template>
                </ol>
                <p x-show="detail && ck.note" class="mt-1.5 text-xs text-emerald-800 bg-emerald-100 rounded px-2.5 py-1" x-text="ck.note"></p>
              </div>
              </template>
              </div></template>

              <!-- ngộ nhận của lá -->
              <template x-if="show.watch && tagged(sec.watch_out, leaf.id).length">
              <div class="px-4 pt-3">
                <p class="text-[13px] font-bold uppercase tracking-wider text-amber-600 mb-1.5">⚠ Dễ nhầm chỗ này</p>
                <div class="space-y-2">
                  <template x-for="(w, i) in tagged(sec.watch_out, leaf.id)" :key="i">
                    <div class="rounded-lg border border-amber-200 bg-amber-50 overflow-hidden">
                      <p class="flex gap-2 px-3 py-2 text-sm text-slate-600">
                        <span class="text-rose-500 font-bold shrink-0">✗</span>
                        <span class="line-through decoration-rose-300" x-text="w.wrong"></span>
                      </p>
                      <p class="flex gap-2 px-3 py-2 text-sm text-slate-800 bg-white border-t border-amber-200">
                        <span class="text-emerald-600 font-bold shrink-0">✓</span>
                        <span x-text="w.right"></span>
                      </p>
                    </div>
                  </template>
                </div>
              </div>
              </template>

              <!-- thí nghiệm thuộc lá: có thể nhiều. Chỉ 1–2 câu tóm tắt cách làm + 1 câu
                   kết quả (không liệt kê dụng cụ/bước), hình cắt rộng từ trang sách đặt cạnh. -->
              <template x-if="show.exp"><div>
              <template x-for="(ex, ei) in exps(sec, leaf.id)" :key="'e' + ei">
              <div class="px-4 pt-3">
                <p class="text-[13px] font-bold uppercase tracking-wider text-violet-600 mb-1.5">🔬 <span x-text="ex.title || 'Thí nghiệm trong sách'"></span><span x-show="ex.page" class="font-normal normal-case text-slate-400" x-text="' · p.' + ex.page"></span></p>
                <div class="rounded-lg border border-violet-200 bg-violet-50 px-3 py-2.5 flex gap-3 items-start">
                  <div class="min-w-0 flex-1 text-sm space-y-1.5">
                    <p x-show="ex.summary" class="text-slate-700" x-text="ex.summary"></p>
                    <p x-show="ex.result" class="font-medium text-violet-900"><span class="font-semibold">Thấy:</span> <span x-text="ex.result"></span></p>
                  </div>
                  <!-- x-if chứ không x-show: :src vẫn bind khi ẩn → trình duyệt tải "img/null" (404) -->
                  <template x-if="ex.image">
                  <img :src="'study/img/' + ex.image" :alt="ex.title || ''" loading="lazy"
                       class="w-36 sm:w-52 max-h-56 shrink-0 rounded-md border border-violet-200 bg-white object-contain">
                  </template>
                </div>
              </div>
              </template>
              </div></template>

              <!-- bài mẫu thuộc lá (môn Toán): CÁC BƯỚC chính là kiến thức, nên ở đây
                   giữ nguyên từng bước — ngược hẳn với khối thí nghiệm của môn Science,
                   nơi các bước bị lược đi. Đừng gộp hai khối làm một. -->
              <template x-if="show.worked"><div>
              <template x-for="(wk, wi) in works(sec, leaf.id)" :key="'w' + wi">
              <div class="px-4 pt-3">
                <p class="text-[13px] font-bold uppercase tracking-wider text-teal-700 mb-1.5">🧮 <span x-text="wk.title || 'Bài mẫu'"></span><span x-show="wk.page" class="font-normal normal-case text-slate-400" x-text="' · p.' + wk.page"></span></p>
                <div class="rounded-lg border border-teal-200 bg-teal-50 px-3 py-2.5 text-sm space-y-1.5">
                  <p class="font-semibold text-slate-900" x-text="wk.problem"></p>
                  <ol class="list-decimal pl-5 text-slate-700 space-y-0.5">
                    <template x-for="(st, si) in (wk.steps || [])" :key="si"><li x-text="st"></li></template>
                  </ol>
                  <p class="font-medium text-teal-900"><span class="font-semibold">Đáp số:</span> <span x-text="wk.answer"></span></p>
                  <p x-show="detail && wk.why" class="text-xs text-slate-500 italic" x-text="wk.why"></p>
                </div>
              </div>
              </template>
              </div></template>

              <!-- so sánh thuộc lá: có thể nhiều -->
              <template x-if="show.compare"><div>
              <template x-for="(cp, pi) in comps(sec, leaf.id)" :key="'c' + pi">
              <div class="px-4 pt-3">
                <p class="text-[13px] font-bold uppercase tracking-wider text-slate-600 mb-1.5">⇄ <span x-text="cp.title || 'So sánh'"></span></p>
                <div class="rounded-lg border border-slate-200 overflow-hidden">
                  <div class="grid grid-cols-[6.5rem_1fr_1fr] text-sm font-semibold">
                    <div class="bg-slate-100 px-2 py-2"></div>
                    <div class="bg-emerald-50 text-emerald-800 px-2 py-2 border-l border-slate-200" x-text="cp.label_a"></div>
                    <div class="bg-slate-50 text-slate-700 px-2 py-2 border-l border-slate-200" x-text="cp.label_b"></div>
                  </div>
                  <template x-for="(r, i) in cp.rows" :key="i">
                    <div class="grid grid-cols-[6.5rem_1fr_1fr] text-sm border-t border-slate-200">
                      <div class="bg-slate-50 px-2 py-2 font-medium text-slate-600" x-text="r.aspect"></div>
                      <div class="px-2 py-2 text-slate-700 border-l border-slate-200" x-text="r.a"></div>
                      <div class="px-2 py-2 text-slate-500 border-l border-slate-200" x-text="r.b"></div>
                    </div>
                  </template>
                </div>
              </div>
              </template>
              </div></template>
              <div class="h-3"></div>
            </div>
          </template>

          <!-- ── Phần thuộc CẢ mục (không gắn lá): bảng đối chiếu, và mọi thứ
               chưa gắn nhãn — để dữ liệu cũ vẫn hiện đủ.                       -->
          <template x-for="(cp, pi) in (show.compare ? secComps(sec) : [])" :key="'sc' + pi">
          <div class="px-5 pb-4">
            <p class="text-[13px] font-bold uppercase tracking-wider text-slate-600 mb-1.5">⇄ So sánh</p>
            <div class="rounded-lg border border-slate-200 overflow-hidden">
              <div class="grid grid-cols-[6.5rem_1fr_1fr] text-sm font-semibold">
                <div class="bg-slate-100 px-2 py-2"></div>
                <div class="bg-emerald-50 text-emerald-800 px-2 py-2 border-l border-slate-200" x-text="cp.label_a"></div>
                <div class="bg-slate-50 text-slate-700 px-2 py-2 border-l border-slate-200" x-text="cp.label_b"></div>
              </div>
              <template x-for="(r, i) in cp.rows" :key="i">
                <div class="grid grid-cols-[6.5rem_1fr_1fr] text-sm border-t border-slate-200">
                  <div class="bg-slate-50 px-2 py-2 font-medium text-slate-600" x-text="r.aspect"></div>
                  <div class="px-2 py-2 text-slate-700 border-l border-slate-200" x-text="r.a"></div>
                  <div class="px-2 py-2 text-slate-500 border-l border-slate-200" x-text="r.b"></div>
                </div>
              </template>
            </div>
          </div>
          </template>

          <template x-if="untagged(sec).any">
          <div class="px-5 pb-4 space-y-3">
            <template x-if="show.gloss && untagged(sec).glossary.length">
            <dl class="grid gap-x-3 gap-y-1.5 sm:grid-cols-2">
              <template x-for="g in untagged(sec).glossary" :key="g.term">
                <div class="rounded-lg bg-indigo-50/60 border border-indigo-100 px-3 py-2">
                  <dt class="text-sm font-semibold text-indigo-900"><span x-text="g.term"></span><button x-show="canSpeak" @click.stop="speak(g.term)" type="button" title="Đọc to"
                        class="ml-1 inline-flex items-center justify-center w-6 h-6 rounded-full text-indigo-500 hover:bg-indigo-100 align-middle">🔊</button></dt>
                  <dd class="text-sm text-slate-700 leading-snug" x-text="g.def"></dd>
                  <dd x-show="g.example" class="mt-0.5 text-xs text-slate-500 italic" x-text="g.example"></dd>
                </div>
              </template>
            </dl>
            </template>
            <template x-if="show.facts && untagged(sec).points.length">
            <div class="grid gap-2 sm:grid-cols-2">
              <template x-for="(pt, i) in untagged(sec).points" :key="i">
                <div class="flex gap-2.5 rounded-lg border border-slate-200 p-3">
                  <p class="text-sm text-slate-700 leading-snug"><span class="font-semibold text-slate-900" x-text="lead(pt.t)[0]"></span><span x-text="lead(pt.t)[1]"></span></p>
                </div>
              </template>
            </div>
            </template>
            <template x-if="show.list && secLists(sec).length && (sec.checklist = secLists(sec)[0])">
            <div>
              <p class="text-xs font-bold uppercase tracking-wide text-emerald-700 mb-2">✅ <span x-text="sec.checklist.title"></span></p>
              <ol class="space-y-2">
                <template x-for="(it, i) in sec.checklist.items" :key="i">
                  <li class="flex gap-3 rounded-lg border border-emerald-200 bg-emerald-50/60 px-3 py-2.5">
                    <div class="min-w-0">
                      <p class="text-sm font-semibold text-slate-900" x-text="it.sign"></p>
                      <p class="text-sm text-slate-700" x-text="it.look_for"></p>
                      <p x-show="it.book_example" class="mt-0.5 text-xs text-slate-500 italic" x-text="it.book_example"></p>
                    </div>
                  </li>
                </template>
              </ol>
              <p x-show="sec.checklist.note" class="mt-2 text-xs text-emerald-800 bg-emerald-100 rounded px-3 py-1.5" x-text="sec.checklist.note"></p>
            </div>
            </template>
            <template x-if="show.watch && untagged(sec).watch.length">
            <div>
              <p class="text-xs font-bold uppercase tracking-wide text-amber-600 mb-2">⚠ Dễ nhầm chỗ này</p>
              <div class="space-y-2">
                <template x-for="(w, i) in untagged(sec).watch" :key="i">
                  <div class="rounded-lg border border-amber-200 bg-amber-50 overflow-hidden">
                    <p class="flex gap-2 px-3 py-2 text-sm text-slate-600"><span class="text-rose-500 font-bold shrink-0">✗</span><span class="line-through decoration-rose-300" x-text="w.wrong"></span></p>
                    <p class="flex gap-2 px-3 py-2 text-sm text-slate-800 bg-white border-t border-amber-200"><span class="text-emerald-600 font-bold shrink-0">✓</span><span x-text="w.right"></span></p>
                  </div>
                </template>
              </div>
            </div>
            </template>
            <template x-if="show.exp && secExps(sec).length && (sec.from_the_book = secExps(sec)[0])">
            <div class="rounded-lg border border-sky-200 bg-sky-50 px-4 py-3">
              <p class="text-xs font-bold uppercase tracking-wide text-sky-700">🔬 Thí nghiệm trong sách</p>
              <p class="mt-1.5 text-sm text-slate-700" x-text="sec.from_the_book.activity"></p>
              <p class="mt-1.5 text-sm font-medium text-sky-900" x-text="sec.from_the_book.what_it_shows"></p>
            </div>
            </template>
          </div>
          </template>

          <!-- ── Thuật ngữ ────────────────────────────────────────────────── -->
          <div x-show="(sec.terms || []).length" x-cloak class="px-5 pb-5 flex flex-wrap gap-1.5">
            <template x-for="t in (sec.terms || [])" :key="t">
              <span class="px-2 py-0.5 text-xs rounded-full bg-indigo-50 text-indigo-700 border border-indigo-100" x-text="t"></span>
            </template>
          </div>
        </section>
      </template>
    </div>
    </template>

    <!-- ── Kết thúc ─────────────────────────────────────────────────────── -->
    <div x-show="screen === 'done'" x-cloak class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 text-center">
      <p class="text-3xl font-bold text-slate-900"><span x-text="mode === 'cards' ? tStats.known : qStats.ok"></span>/<span x-text="mode === 'cards' ? tStats.n : qStats.n"></span></p>
      <p class="mt-1 text-sm text-slate-500" x-text="mode === 'cards' ? 'thẻ đã thuộc' : 'câu đúng'"></p>
      <p x-show="err" x-cloak class="mt-3 text-xs text-amber-700" x-text="err"></p>
      <div class="mt-5 flex justify-center gap-2">
        <button @click="screen = 'start'"
                class="px-4 py-2 text-sm font-medium rounded-lg bg-indigo-600 text-white hover:bg-indigo-700">
          Ôn tiếp
        </button>
        <a href="cie-science-5.html"
           class="px-4 py-2 text-sm font-medium rounded-lg bg-white border border-slate-300 text-slate-700 hover:border-indigo-500">
          Về trang môn
        </a>
      </div>
    </div>
  </main>
  </div>
</body>
</html>
